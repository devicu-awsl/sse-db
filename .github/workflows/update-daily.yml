name: update-atlas

# Answers "can the database keep itself current without me running the script?"
#
# Atlas cannot do this itself.  Atlas App Services has reached end-of-life, and
# even where Scheduled Triggers survive they run JavaScript in a serverless
# sandbox with no access to `yfinance`, to `sse.ingest.quality.sanitize`, or to
# the int32/sha256 binary codec in `sse.codec` that every chunk is written
# through.  A trigger could at best write documents the repository layer cannot
# read.  So the scheduler lives outside Atlas and runs the real script.
#
# CREDENTIALS.  Nothing here reads `.env`.  `Settings` in src/sse/config.py is a
# pydantic-settings model with `env_prefix="SSE_"`, and an environment variable
# always outranks a `.env` file, so exporting SSE_MONGODB_URI into a step is
# exactly equivalent to writing it into `.env` — without the file existing.
# `.env.example` is documentation for humans; CI does not need it and must not
# have a real `.env` committed.  Set the value once as a repository secret:
#
#   Settings -> Secrets and variables -> Actions -> New repository secret
#     Name:  SSE_MONGODB_URI
#     Value: mongodb+srv://USER:PERCENT-ENCODED-PASSWORD@cluster0.xxxxx.mongodb.net/?retryWrites=true&w=majority&appName=Cluster0
#
# Paste the value WITHOUT the surrounding quotes that `.env.example` shows —
# a shell strips those, the secret box does not, and `"mongodb+srv://...` is
# not a valid URI scheme.

on:
  # ------------------------------------------------------------------ toggle
  # Run on every sync so a change can be proven immediately, instead of waiting
  # for 16:00 UTC to find out.  Two brakes stop this becoming expensive:
  #
  #   1. the job-level `if:` below — a push only runs when the repository
  #      variable RUN_ON_PUSH is "true", or the commit message says [run ci].
  #      Turn it on now, delete the variable when you are done testing.
  #      (Settings -> Secrets and variables -> Actions -> Variables tab.)
  #   2. a push run is forced into smoke-test mode (a handful of tickers, no
  #      screener refresh) in the "Decide which mode this run is" step, so it
  #      costs about a minute rather than 30.
  #
  # `paths-ignore` keeps documentation edits — including the bot's own status
  # commit — from triggering anything.  The bot also tags that commit [skip ci],
  # which GitHub honours for push events, so the loop is closed twice over.
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"

  schedule:
    # 00:00 CST (UTC+8) every day = 16:00 UTC the previous day. Cron is UTC only,
    # so the hour is shifted, not the intent. The most recent completed session
    # at that moment is the previous trading day, which closed at 15:00 CST with
    # nine hours for Yahoo to settle its bars.
    #
    # `* * *` runs on weekends too, and those runs are no-ops that still cost
    # ~30 minutes of Actions minutes each because the Yahoo rate limiter
    # dominates. To skip them use "0 16 * * 0-4": 16:00 UTC Sun-Thu maps to
    # 00:00 CST Mon-Fri, which covers every session.
    - cron: "0 16 * * *"
    # Weekly full-adjustment resync at 11:00 CST Sunday. A split retroactively
    # rewrites the entire adj_close history, so a delta-only updater drifts out
    # of sync silently and for ever.
    - cron: "0 03 * * 0"

  workflow_dispatch:
    inputs:
      full_refresh:
        description: "Force a full-adjustment resync"
        type: boolean
        default: false
      limit:
        description: "Only update the first N tickers (smoke test; blank = all)"
        type: string
        default: ""
      skip_universe:
        description: "Skip the screener refresh (faster; use for a quick check)"
        type: boolean
        default: false

permissions:
  # The job now writes the status block back to README and updates a rolling
  # release, so the default read-only token is not enough.
  contents: write

concurrency:
  # Two updaters writing the same (ticker, year) chunks is the one way to
  # corrupt an otherwise idempotent upsert.
  group: update-atlas
  cancel-in-progress: false

jobs:
  update:
    # The push brake.  Scheduled and manual runs are unaffected; a push runs
    # only when you have opted in, either standing (the RUN_ON_PUSH variable)
    # or for one commit ([run ci] anywhere in the message).
    if: >-
      github.event_name != 'push'
      || vars.RUN_ON_PUSH == 'true'
      || contains(github.event.head_commit.message, '[run ci]')

    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          # Needed so the status commit can be pushed back.
          persist-credentials: true
          # The push-retry loop below rebases onto origin/main.  A rebase needs
          # real history, and checkout's default `fetch-depth: 1` gives it a
          # single grafted commit, so the retry would fail on the one occasion
          # it exists to handle.
          fetch-depth: 0

      # Without this, a missing or malformed secret surfaces 90 seconds later as
      # "database unavailable" from the guard — which reads like Atlas is down
      # rather than like a value was never set.  Fail in two seconds with the
      # actual cause instead.  Nothing here echoes the secret.
      - name: Check the Atlas secret is present and shaped like a URI
        env:
          SSE_MONGODB_URI: ${{ secrets.SSE_MONGODB_URI }}
        run: |
          if [ -z "$SSE_MONGODB_URI" ]; then
            echo "::error::Repository secret SSE_MONGODB_URI is not set. Settings -> Secrets and variables -> Actions -> New repository secret."
            exit 1
          fi
          case "$SSE_MONGODB_URI" in
            '"'*|"'"*)
              echo "::error::SSE_MONGODB_URI begins with a quote. Paste the bare connection string; .env.example's quotes are shell syntax, not part of the value."
              exit 1 ;;
          esac
          case "$SSE_MONGODB_URI" in
            mongodb://*|mongodb+srv://*) : ;;
            *)
              echo "::error::SSE_MONGODB_URI does not start with mongodb:// or mongodb+srv://."
              exit 1 ;;
          esac
          case "$SSE_MONGODB_URI" in
            *"<user>"*|*"<url-encoded-password>"*|*"<cluster>"*)
              echo "::error::SSE_MONGODB_URI still contains .env.example placeholders."
              exit 1 ;;
          esac
          echo "secret present and well-formed"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Recreate the locked environment
        # --no-default-groups because pyproject sets `default-groups = "all"`,
        # which would otherwise drag scipy, scikit-learn, statsmodels,
        # matplotlib and jupyterlab into a job that only needs yfinance and
        # pymongo. pyproject.toml and uv.lock stay byte-identical to the
        # research repo, so the two never drift.
        run: uv sync --no-default-groups

      - name: Decide which mode this run is
        id: mode
        # Values arrive through `env:` rather than being interpolated straight
        # into the script.  A `${{ inputs.limit }}` sitting inside a shell line
        # is the argument, not a variable holding it, so anything typed into the
        # dispatch form is executed by bash; "$LIMIT" is only ever read.
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          IN_FULL: ${{ inputs.full_refresh }}
          IN_LIMIT: ${{ inputs.limit }}
          IN_SKIP_UNIVERSE: ${{ inputs.skip_universe }}
          # Override without editing the file: set a PUSH_SMOKE_LIMIT variable.
          PUSH_SMOKE_LIMIT: ${{ vars.PUSH_SMOKE_LIMIT || '20' }}
        run: |
          ARGS=""
          LABEL="incremental"
          FULL="false"
          LIMIT="$IN_LIMIT"

          if [ "$SCHEDULE" = "0 03 * * 0" ] || [ "$IN_FULL" = "true" ]; then
            ARGS="--full-refresh"
            LABEL="full refresh"
            FULL="true"
          fi

          # A push means "I just changed something, does it still work?" — not
          # "ingest the whole exchange".  Force the cheap path: the secret, the
          # cluster, the Yahoo client and the codec are all exercised in about a
          # minute.  Use workflow_dispatch when you want a real pass.
          if [ "$EVENT" = "push" ] && [ -z "$LIMIT" ]; then
            LIMIT="$PUSH_SMOKE_LIMIT"
            ARGS="$ARGS --skip-universe"
            LABEL="push smoke test"
          fi

          # A manual smoke test: prove the secret, the cluster and the Yahoo
          # path all work in about a minute, instead of finding out 40 minutes
          # into a full pass.
          if [ -n "$LIMIT" ]; then
            ARGS="$ARGS --limit $LIMIT"
            LABEL="$LABEL, first $LIMIT tickers"
          fi
          if [ "$IN_SKIP_UNIVERSE" = "true" ]; then
            case "$ARGS" in *--skip-universe*) : ;; *) ARGS="$ARGS --skip-universe" ;; esac
          fi

          echo "flag=$ARGS"   >> "$GITHUB_OUTPUT"
          echo "label=$LABEL" >> "$GITHUB_OUTPUT"
          echo "full=$FULL"   >> "$GITHUB_OUTPUT"
          # Downstream steps ask "was this a partial run?" — which is now also
          # true for pushes, where `inputs.limit` is null.  They must read this
          # output, not the input, or a 20-ticker push would publish a status
          # block claiming the repository holds 20 tickers.
          echo "limit=$LIMIT" >> "$GITHUB_OUTPUT"

      # `concurrency:` above only serialises runs inside GitHub. It knows
      # nothing about `python scripts/update_daily.py` running on a laptop
      # against the same Atlas cluster. The lock therefore lives in the
      # `ingestion_runs` collection, which both writers can see.
      - name: Check nobody else is updating (laptop included)
        id: guard
        env:
          SSE_MONGODB_URI: ${{ secrets.SSE_MONGODB_URI }}
          SSE_DB_NAME: ${{ vars.SSE_DB_NAME || 'sse_market' }}
        run: |
          set +e
          uv run --no-default-groups python scripts/run_guard.py --wait 20
          rc=$?
          set -e
          if [ "$rc" = "75" ]; then
            echo "busy=true" >> "$GITHUB_OUTPUT"
            echo "::notice::another updater is running; skipping rather than racing it"
            exit 0
          fi
          if [ "$rc" = "3" ]; then
            echo "::error::run_guard could not reach the cluster. The secret parsed, so check Atlas Network Access allows the runner (GitHub-hosted runners have no fixed IP: 0.0.0.0/0 with a strong password, or a self-hosted runner), that the database user exists, and that the password in the URI is percent-encoded."
          fi
          echo "busy=false" >> "$GITHUB_OUTPUT"
          exit $rc

      - name: Run the updater (${{ steps.mode.outputs.label }})
        if: steps.guard.outputs.busy != 'true'
        env:
          # Settings are read from the environment with the SSE_ prefix, so no
          # .env file is needed and the URI never touches the filesystem.
          SSE_MONGODB_URI: ${{ secrets.SSE_MONGODB_URI }}
          SSE_DB_NAME: ${{ vars.SSE_DB_NAME || 'sse_market' }}
        # Non-zero exit already means something real: 1 failures above tolerance
        # or validation errors, 2 storage guard tripped, 3 database down. Let it
        # fail the job — a silent updater is the failure mode that matters.
        run: uv run --no-default-groups python scripts/update_daily.py ${{ steps.mode.outputs.flag }}

      - name: Verify integrity after a full refresh
        if: steps.mode.outputs.full == 'true' && steps.mode.outputs.limit == '' && steps.guard.outputs.busy != 'true'
        env:
          SSE_MONGODB_URI: ${{ secrets.SSE_MONGODB_URI }}
          SSE_DB_NAME: ${{ vars.SSE_DB_NAME || 'sse_market' }}
        run: uv run --no-default-groups python scripts/verify_integrity.py

      # ---------------------------------------------------------------- status
      # "When was this last updated?" should be answerable without opening the
      # Actions tab. Two timestamps get published because they are different
      # facts: `data through` is the newest stored session, `last run` only says
      # the automation fired. A job that succeeds against a market that was shut
      # for a week is green on the second and eight days stale on the first.
      - name: Render the status block
        # A --limit smoke test covers a handful of tickers, so its counters are
        # not the repository's status. Publishing them would make the README
        # claim 20 tickers when 2,360 are stored.
        # `always()` so a failed run publishes a red badge rather than silently
        # leaving yesterday's green one in place.
        if: always() && steps.mode.outputs.limit == '' && steps.guard.outputs.busy != 'true'
        env:
          SSE_MONGODB_URI: ${{ secrets.SSE_MONGODB_URI }}
          SSE_DB_NAME: ${{ vars.SSE_DB_NAME || 'sse_market' }}
        continue-on-error: true
        run: |
          uv run --no-default-groups python scripts/status_report.py \
            --readme README.md \
            --release-notes /tmp/release-notes.md

      - name: Commit the status block if it changed
        if: always() && steps.mode.outputs.limit == '' && steps.guard.outputs.busy != 'true'
        continue-on-error: true
        run: |
          if git diff --quiet -- README.md; then
            echo "status block unchanged — nothing to commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          # [skip ci] so the push does not retrigger anything. The commit is also
          # what resets GitHub's 60-day scheduled-workflow inactivity timer, so
          # the schedule keeps itself alive as a side effect.
          git commit -m "chore(data): status through ${{ github.run_id }} [skip ci]"
          # You push to this branch from a laptop too, so the remote may have
          # moved since checkout. Rebase and retry rather than failing the job
          # or, worse, force-pushing over your own work. The status block is
          # regenerated content, so `--ours` on a conflict inside it is safe --
          # but only inside it, which is why the rebase is scoped to README.md.
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "push rejected (attempt $attempt) — rebasing onto the remote"
            git fetch origin "${GITHUB_REF_NAME}"
            if ! git rebase "origin/${GITHUB_REF_NAME}"; then
              git checkout --ours -- README.md
              git add README.md
              GIT_EDITOR=true git rebase --continue || git rebase --abort
            fi
            sleep 5
          done
          echo "::warning::could not push the status block after 3 attempts"

      - name: Update the rolling 'latest data' release
        if: always() && steps.mode.outputs.limit == '' && steps.guard.outputs.busy != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -s /tmp/release-notes.md || exit 0
          # One rolling release rather than one per night: a nightly job would
          # otherwise produce hundreds of releases nobody reads.
          if gh release view data-latest >/dev/null 2>&1; then
            gh release edit data-latest \
              --title "Data as of $(date -u '+%Y-%m-%d %H:%M UTC')" \
              --notes-file /tmp/release-notes.md
          else
            gh release create data-latest \
              --title "Data as of $(date -u '+%Y-%m-%d %H:%M UTC')" \
              --notes-file /tmp/release-notes.md \
              --latest
          fi

      - name: Keep the run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: update-report-${{ github.run_id }}
          path: |
            reports/update_last.json
            reports/integrity.json
          if-no-files-found: ignore
          retention-days: 30
