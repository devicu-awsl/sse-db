name: update-atlas

# Answers "can the database keep itself current without me running the script?"
#
# Atlas cannot do this itself.  Atlas App Services has reached end-of-life, and
# even where Scheduled Triggers survive they run JavaScript in a serverless
# sandbox with no access to `yfinance`, to `sse.ingest.quality.sanitize`, or to
# the int32/sha256 binary codec in `sse.codec` that every chunk is written
# through.  A trigger could at best write documents the repository layer cannot
# read.  So the scheduler lives outside Atlas and runs the real script.

on:
  schedule:
    # 00:00 CST (UTC+8) every day = 16:00 UTC the previous day. Cron is UTC only,
    # so the hour is shifted, not the intent. The most recent completed session
    # at that moment is the previous trading day, which closed at 15:00 CST with
    # nine hours for Yahoo to settle its bars.
    #
    # `* * *` runs on weekends too, and those runs are no-ops that still cost
    # ~30 minutes of Actions minutes each because the Yahoo rate limiter
    # dominates. To skip them use "0 16 * * 0-4": 16:00 UTC Sun-Thu maps to
    # 00:00 CST Mon-Fri, which covers every session.
    - cron: "0 16 * * *"
    # Weekly full-adjustment resync at 11:00 CST Sunday. A split retroactively
    # rewrites the entire adj_close history, so a delta-only updater drifts out
    # of sync silently and for ever.
    - cron: "0 03 * * 0"
  workflow_dispatch:
    inputs:
      full_refresh:
        description: "Force a full-adjustment resync"
        type: boolean
        default: false
      limit:
        description: "Only update the first N tickers (smoke test; blank = all)"
        type: string
        default: ""
      skip_universe:
        description: "Skip the screener refresh (faster; use for a quick check)"
        type: boolean
        default: false

permissions:
  # The job now writes the status block back to README and updates a rolling
  # release, so the default read-only token is not enough.
  contents: write

concurrency:
  # Two updaters writing the same (ticker, year) chunks is the one way to
  # corrupt an otherwise idempotent upsert.
  group: update-atlas
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          # Needed so the status commit can be pushed back.
          persist-credentials: true

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Recreate the locked environment
        # --no-default-groups because pyproject sets `default-groups = "all"`,
        # which would otherwise drag scipy, scikit-learn, statsmodels,
        # matplotlib and jupyterlab into a job that only needs yfinance and
        # pymongo. pyproject.toml and uv.lock stay byte-identical to the
        # research repo, so the two never drift.
        run: uv sync --no-default-groups

      - name: Decide which mode this run is
        id: mode
        run: |
          ARGS=""
          LABEL="incremental"
          FULL="false"
          if [ "${{ github.event.schedule }}" = "0 03 * * 0" ] || \
             [ "${{ inputs.full_refresh }}" = "true" ]; then
            ARGS="--full-refresh"
            LABEL="full refresh"
            FULL="true"
          fi
          # A manual smoke test: prove the secret, the cluster and the Yahoo
          # path all work in about a minute, instead of finding out 40 minutes
          # into a full pass. Only reachable via workflow_dispatch.
          if [ -n "${{ inputs.limit }}" ]; then
            ARGS="$ARGS --limit ${{ inputs.limit }}"
            LABEL="$LABEL, first ${{ inputs.limit }} tickers"
          fi
          if [ "${{ inputs.skip_universe }}" = "true" ]; then
            ARGS="$ARGS --skip-universe"
          fi
          echo "flag=$ARGS" >> "$GITHUB_OUTPUT"
          echo "label=$LABEL" >> "$GITHUB_OUTPUT"
          echo "full=$FULL" >> "$GITHUB_OUTPUT"

      # `concurrency:` above only serialises runs inside GitHub. It knows
      # nothing about `python scripts/update_daily.py` running on a laptop
      # against the same Atlas cluster. The lock therefore lives in the
      # `ingestion_runs` collection, which both writers can see.
      - name: Check nobody else is updating (laptop included)
        id: guard
        env:
          SSE_MONGODB_URI: ${{ secrets.SSE_MONGODB_URI }}
          SSE_DB_NAME: ${{ vars.SSE_DB_NAME || 'sse_market' }}
        run: |
          set +e
          uv run --no-default-groups python scripts/run_guard.py --wait 20
          rc=$?
          set -e
          if [ "$rc" = "75" ]; then
            echo "busy=true" >> "$GITHUB_OUTPUT"
            echo "::notice::another updater is running; skipping rather than racing it"
            exit 0
          fi
          echo "busy=false" >> "$GITHUB_OUTPUT"
          exit $rc

      - name: Run the updater (${{ steps.mode.outputs.label }})
        if: steps.guard.outputs.busy != 'true'
        env:
          # Settings are read from the environment with the SSE_ prefix, so no
          # .env file is needed and the URI never touches the filesystem.
          SSE_MONGODB_URI: ${{ secrets.SSE_MONGODB_URI }}
          SSE_DB_NAME: ${{ vars.SSE_DB_NAME || 'sse_market' }}
        # Non-zero exit already means something real: 1 failures above tolerance
        # or validation errors, 2 storage guard tripped, 3 database down. Let it
        # fail the job — a silent updater is the failure mode that matters.
        run: uv run --no-default-groups python scripts/update_daily.py ${{ steps.mode.outputs.flag }}

      - name: Verify integrity after a full refresh
        if: steps.mode.outputs.full == 'true' && inputs.limit == '' && steps.guard.outputs.busy != 'true'
        env:
          SSE_MONGODB_URI: ${{ secrets.SSE_MONGODB_URI }}
          SSE_DB_NAME: ${{ vars.SSE_DB_NAME || 'sse_market' }}
        run: uv run --no-default-groups python scripts/verify_integrity.py

      # ---------------------------------------------------------------- status
      # "When was this last updated?" should be answerable without opening the
      # Actions tab. Two timestamps get published because they are different
      # facts: `data through` is the newest stored session, `last run` only says
      # the automation fired. A job that succeeds against a market that was shut
      # for a week is green on the second and eight days stale on the first.
      - name: Render the status block
        # A --limit smoke test covers a handful of tickers, so its counters are
        # not the repository's status. Publishing them would make the README
        # claim 20 tickers when 2,360 are stored.
        # `always()` so a failed run publishes a red badge rather than silently
        # leaving yesterday's green one in place.
        if: always() && inputs.limit == '' && steps.guard.outputs.busy != 'true'
        env:
          SSE_MONGODB_URI: ${{ secrets.SSE_MONGODB_URI }}
          SSE_DB_NAME: ${{ vars.SSE_DB_NAME || 'sse_market' }}
        continue-on-error: true
        run: |
          uv run --no-default-groups python scripts/status_report.py \
            --readme README.md \
            --release-notes /tmp/release-notes.md

      - name: Commit the status block if it changed
        if: always() && inputs.limit == '' && steps.guard.outputs.busy != 'true'
        continue-on-error: true
        run: |
          if git diff --quiet -- README.md; then
            echo "status block unchanged — nothing to commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          # [skip ci] so the push does not retrigger anything. The commit is also
          # what resets GitHub's 60-day scheduled-workflow inactivity timer, so
          # the schedule keeps itself alive as a side effect.
          git commit -m "chore(data): status through ${{ github.run_id }} [skip ci]"
          # You push to this branch from a laptop too, so the remote may have
          # moved since checkout. Rebase and retry rather than failing the job
          # or, worse, force-pushing over your own work. The status block is
          # regenerated content, so `--ours` on a conflict inside it is safe --
          # but only inside it, which is why the rebase is scoped to README.md.
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "push rejected (attempt $attempt) — rebasing onto the remote"
            git fetch origin "${GITHUB_REF_NAME}"
            git checkout --ours README.md 2>/dev/null || true
            if ! git rebase "origin/${GITHUB_REF_NAME}"; then
              git checkout --ours -- README.md
              git add README.md
              GIT_EDITOR=true git rebase --continue || git rebase --abort
            fi
            sleep 5
          done
          echo "::warning::could not push the status block after 3 attempts"

      - name: Update the rolling 'latest data' release
        if: always() && inputs.limit == '' && steps.guard.outputs.busy != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -s /tmp/release-notes.md || exit 0
          # One rolling release rather than one per night: a nightly job would
          # otherwise produce hundreds of releases nobody reads.
          if gh release view data-latest >/dev/null 2>&1; then
            gh release edit data-latest \
              --title "Data as of $(date -u '+%Y-%m-%d %H:%M UTC')" \
              --notes-file /tmp/release-notes.md
          else
            gh release create data-latest \
              --title "Data as of $(date -u '+%Y-%m-%d %H:%M UTC')" \
              --notes-file /tmp/release-notes.md \
              --latest
          fi

      - name: Keep the run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: update-report-${{ github.run_id }}
          path: |
            reports/update_last.json
            reports/integrity.json
          if-no-files-found: ignore
          retention-days: 30
