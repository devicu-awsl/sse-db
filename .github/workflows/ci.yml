name: ci

# The half of the problem a secret cannot solve.
#
# `update-atlas` must reach the real cluster — writing to Atlas *is* the job, so
# a throwaway database cannot stand in for it.  But most of what breaks has
# nothing to do with Atlas: an import that no longer resolves, a schema change
# that invalidates an index, a codec edit that stops round-tripping.  Those are
# provable against a MongoDB that is created and destroyed inside the runner, so
# this workflow needs no credentials at all, runs on every push and pull request
# (including forks, which cannot read secrets), and can never touch real data.
#
# Read it as the cheap gate and `update-atlas` as the expensive one.

on:
  push:
  pull_request:
  workflow_dispatch:

# No `contents: write` here — this workflow publishes nothing.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Same variable the application already reads.  Nothing in the code has to
      # know it is talking to a container rather than Atlas — which is precisely
      # what makes this a real test of the code path.
      #
      # A replica set rather than a standalone because `sse.db.client` passes
      # `retryWrites=True`, and retryable writes are a replica-set feature; the
      # single-node set below satisfies that without any of Atlas's cost.
      SSE_MONGODB_URI: "mongodb://localhost:27017/?replicaSet=rs0"
      SSE_DB_NAME: "sse_ci"
      SSE_LOG_LEVEL: "INFO"

    steps:
      - uses: actions/checkout@v4

      # The marketplace action rather than a plain `services:` block, for one
      # reason: `services:` starts a bare container, and there is no clean hook
      # to run `rs.initiate()` afterwards, so you get a standalone.  This action
      # initialises the set for you.  If you would rather stay on first-party
      # ground, GitHub's documented `services:` form works too — drop the
      # replicaSet from the URI above and accept a standalone server.
      - name: Start a throwaway MongoDB
        uses: supercharge/mongodb-github-action@1.12.1
        with:
          mongodb-version: "7.0"
          mongodb-replica-set: rs0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Recreate the locked environment
        run: uv sync --locked --no-default-groups

      # Cheapest possible check, and the one that catches most breakage: does
      # the import graph the nightly job depends on still resolve at all?
      - name: Import the modules the updater needs
        run: |
          uv run --no-default-groups python -c "
          import sse.codec, sse.calendar_utils, sse.config
          import sse.db.client, sse.db.repository, sse.db.schema
          import sse.ingest.provider, sse.ingest.quality, sse.ingest.universe
          print('import graph OK')
          "

      - name: Connect and report (the same script you run against Atlas)
        run: uv run --no-default-groups python scripts/ping_atlas.py

      - name: Create collections and indexes on the throwaway server
        # Proves every index definition in sse.db.schema is one MongoDB accepts
        # — a conflicting or invalid index fails here rather than at 16:00 UTC
        # against the live cluster.  Idempotent, so run it twice.
        run: |
          uv run --no-default-groups python scripts/init_db.py
          uv run --no-default-groups python scripts/init_db.py

      - name: One ticker, end to end
        # `--tickers` bypasses the securities master, so no universe discovery
        # is needed.  This is the only step that leaves the runner (Yahoo), so
        # it is advisory: a rate-limited upstream is not a defect in this repo.
        continue-on-error: true
        run: |
          uv run --no-default-groups python scripts/update_daily.py \
            --tickers 600000.SS \
            --skip-universe \
            --report reports/ci.json

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-report-${{ github.run_id }}
          path: reports/ci.json
          if-no-files-found: ignore
          retention-days: 7
