[project]
name = "sse-statarb"
version = "0.1.0"
description = "SSE daily-history data system (MongoDB + REST API) for statistical arbitrage research"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dnspython>=2.7",
    "fastapi>=0.115",
    "numpy>=2.0",
    "pandas>=2.2",
    "pymongo>=4.17.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "python-dotenv>=1.0",
    "uvicorn[standard]>=0.30",
    "yfinance>=0.2.60",
]

[dependency-groups]
data = ["pyarrow>=17.0"]
research = ["scipy>=1.14", "scikit-learn>=1.5", "statsmodels>=0.14", "matplotlib>=3.9", "seaborn>=0.13"]
tests = ["pytest>=8.3", "pytest-cov>=5.0", "httpx2>=2.0", "mongomock>=4.3"]
notebook = ["jupyterlab>=4.2", "ipykernel>=6.29", "ipywidgets>=8.1"]

[tool.uv]
default-groups = "all"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
    "integration: requires a live MongoDB connection (deselect with -m 'not integration')",
    "network: requires live Yahoo Finance access (deselect with -m 'not network')",
]

[tool.ruff]
line-length = 100
target-version = "py312"
